name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Aplikasinya ada di app-core/; root repo hanya berisi berkas yang dilayani web
# (index.php, .htaccess, build/) dan meta repo. Semua perkakas dijalankan dari
# app-core, tempat composer.json dan package.json berada.
defaults:
  run:
    working-directory: app-core

jobs:
  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app-core/vendor
          key: composer-${{ hashFiles('app-core/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: composer lint

      - name: Test (Pest)
        run: composer test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-core/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
