name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Aplikasinya ada di app-core/; root repo hanya berisi berkas yang dilayani web
# (index.php, .htaccess, build/) dan meta repo. Semua perkakas dijalankan dari
# app-core, tempat composer.json dan package.json berada.
defaults:
  run:
    working-directory: app-core

jobs:
  quality:
    name: Lint, Test, Build (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # Production runs PHP 8.4 or 8.5; composer.json still allows ^8.2. The suite
    # runs on all three so a green PR proves the code works on the versions it is
    # deployed on, not only on the oldest one allowed. Pint and the asset build
    # do not depend on the PHP version and run once, on 8.4.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app-core/vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('app-core/composer.lock') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        if: matrix.php == '8.4'
        run: composer lint

      # Paralel: paratest membagi berkas tes ke beberapa proses. Tiap proses
      # punya SQLite `:memory:` sendiri, tidak ada tes yang menulis ke
      # storage_path, dan kunci Passport kini per proses (lihat tests/Pest.php
      # siapkanKunciPassport) — tanpa itu dua proses saling menimpa kuncinya dan
      # tesnya gagal 3 dari 5 kali.
      - name: Test (Pest, paralel)
        run: composer test:par

      - name: Setup Node
        if: matrix.php == '8.4'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-core/package-lock.json

      - name: Install JS dependencies
        if: matrix.php == '8.4'
        run: npm ci

      - name: Build assets
        if: matrix.php == '8.4'
        run: npm run build

  # SQLite meloloskan hal yang ditolak mesin sungguhan: nama indeks di atas 64
  # karakter (MySQL), identifier salah ketik yang dibaca sebagai string literal,
  # GROUP BY yang tidak lengkap, dan perbandingan tipe yang longgar (PostgreSQL).
  # Job ini menjalankan migrasi dan seluruh suite di kedua mesin yang dinyatakan
  # didukung di docs/BASIS-DATA.md, agar klaim itu teruji, bukan sekadar tertulis.
  # Satu versi PHP cukup: yang diuji di sini mesinnya, bukan PHP-nya.
  database:
    name: Test on ${{ matrix.name }} (PHP 8.4)
    runs-on: ubuntu-latest
    # Pengaman, bukan target: PostgreSQL tidak punya batas tunggu kunci bawaan,
    # jadi tes yang macet menunggu baris terkunci akan menunggu selamanya alih-alih
    # gagal seperti di MySQL (innodb_lock_wait_timeout 50 detik).
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8
            connection: mysql
            image: mysql:8.0
            port: 3306
            username: root
            health: mysqladmin ping -h 127.0.0.1 --silent
            data: /var/lib/mysql
          - name: PostgreSQL 16
            connection: pgsql
            image: postgres:16
            port: 5432
            username: postgres
            health: pg_isready -U postgres
            data: /var/lib/postgresql/data

    # Satu service per entri matriks. Variabel MYSQL_* diabaikan image Postgres
    # dan sebaliknya, jadi keduanya boleh duduk berdampingan di sini. Direktori
    # data di tmpfs: basis data ini dibuang setelah job, dan ribuan transaksi
    # tes yang menunggu fsync ke disk runner adalah waktu yang tidak menguji apa pun.
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: open_academic_test
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: open_academic_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --tmpfs ${{ matrix.data }}

    # Variabel proses menang atas <env> di phpunit.xml (tanpa force="true"),
    # jadi DB_CONNECTION=sqlite di sana tetap menjadi bawaan untuk job lain dan
    # untuk pengembang. Pengguna superuser karena tes paralel membuat basis data
    # sendiri per proses (open_academic_test_test_1, _2, ...).
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: open_academic_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_pgsql, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app-core/vendor
          key: composer-php8.4-${{ hashFiles('app-core/composer.lock') }}
          restore-keys: composer-php8.4-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Migrasi dan seeder demo pada basis data utama, terpisah dari tes, agar
      # kegagalan skema terbaca sebagai kegagalan skema — bukan sebagai ratusan
      # tes merah dengan pesan yang sama.
      - name: Migrate and seed demo campus
        run: php artisan migrate --seed --force

      - name: Test (Pest, paralel)
        run: composer test:par
