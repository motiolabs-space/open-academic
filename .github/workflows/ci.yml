name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Aplikasinya ada di app-core/; root repo hanya berisi berkas yang dilayani web
# (index.php, .htaccess, build/) dan meta repo. Semua perkakas dijalankan dari
# app-core, tempat composer.json dan package.json berada.
defaults:
  run:
    working-directory: app-core

jobs:
  quality:
    name: Lint, Test, Build (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # Production runs PHP 8.4 or 8.5; composer.json still allows ^8.2. The suite
    # runs on all three so a green PR proves the code works on the versions it is
    # deployed on, not only on the oldest one allowed. Pint and the asset build
    # do not depend on the PHP version and run once, on 8.4.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app-core/vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('app-core/composer.lock') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        if: matrix.php == '8.4'
        run: composer lint

      # Paralel: paratest membagi berkas tes ke beberapa proses. Tiap proses
      # punya SQLite `:memory:` sendiri, tidak ada tes yang menulis ke
      # storage_path, dan kunci Passport kini per proses (lihat tests/Pest.php
      # siapkanKunciPassport) — tanpa itu dua proses saling menimpa kuncinya dan
      # tesnya gagal 3 dari 5 kali.
      - name: Test (Pest, paralel)
        run: composer test:par

      - name: Setup Node
        if: matrix.php == '8.4'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-core/package-lock.json

      - name: Install JS dependencies
        if: matrix.php == '8.4'
        run: npm ci

      - name: Build assets
        if: matrix.php == '8.4'
        run: npm run build
