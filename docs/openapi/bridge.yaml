openapi: 3.1.0

info:
  title: Open Academic — Campus Bridge API
  version: "1.0.0"
  description: |
    Satu-satunya jalan resmi bagi sistem lain untuk membaca data akademik
    Open Academic. Basis data tidak pernah dibagi: konsumen memegang token
    Sanctum ber-scope dan berbicara lewat HTTPS.

    **Spec-first.** Ubah berkas ini lebih dulu, baru kodenya.

    ### Otorisasi
    Setiap endpoint menyatakan scope yang dibutuhkannya. Daftar scope melekat
    pada aplikasi konsumen, bukan pada token — mencabut scope berlaku seketika
    tanpa perlu menerbitkan token baru. Scope tiap operasi tercantum pada
    `security`-nya (daftar peran skema bearer, OpenAPI 3.1); seluruhnya wajib
    dimiliki.

    ### Batas privasi
    Payload sengaja lebih sempit dari model internalnya. NIK, alamat rumah,
    nama orang tua, dan penghasilan keluarga dikumpulkan untuk pelaporan
    PDDIKTI, bukan untuk platform engagement, dan tidak pernah dikirim lewat
    Bridge.

    ### Kunci semester
    Semester selalu direferensikan dengan kode PDDIKTI (`20261` = 2026/2027
    Ganjil), tidak pernah dengan id internal.
  license:
    name: MIT

servers:
  - url: https://{host}/api/bridge/v1
    variables:
      host:
        default: akademik.kampus.ac.id

security:
  - bearerAuth: []

tags:
  - name: Students
  - name: Lecturers
  - name: Classes
  - name: Activities
  - name: Graduates
  - name: Terms
  - name: Evaluations
  - name: Workload
  - name: IKU

paths:
  /students:
    get:
      security: [{ bearerAuth: [students.read] }]
      tags: [Students]
      summary: Daftar mahasiswa
      description: Membutuhkan scope `students.read`.
      parameters:
        - { name: prodi, in: query, schema: { type: string }, description: Kode program studi }
        - { name: angkatan, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [A, C, N, L, D, K, G] } }
        - { name: cari, in: query, schema: { type: string }, description: Cocokkan nama atau NIM }
        - name: sertakan_riwayat
          in: query
          schema: { type: boolean }
          description: Sertakan riwayat IPS/IPK per semester. Dibutuhkan mesin IKU; mahal untuk direktori biasa.
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Student' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/ScopeDitolak' }

  /students/{uuid}:
    get:
      security: [{ bearerAuth: [students.read] }]
      tags: [Students]
      summary: Satu mahasiswa, lengkap dengan riwayat semester
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Student' }
        '404': { description: Tidak ditemukan }

  /students/statistics:
    get:
      security: [{ bearerAuth: [students.read] }]
      tags: [Students]
      summary: Cacah agregat per status dan per program studi
      description: Agar dasbor tidak perlu menelusuri seluruh halaman hanya untuk menghitung.
      responses:
        '200': { description: OK }

  /lecturers:
    get:
      security: [{ bearerAuth: [lecturers.read] }]
      tags: [Lecturers]
      summary: Daftar dosen
      description: Membutuhkan scope `lecturers.read`.
      parameters:
        - { name: prodi, in: query, schema: { type: string } }
        - { name: praktisi, in: query, schema: { type: boolean }, description: Hanya praktisi dari industri (IKU 4 penomoran lama; tanpa padanan 2026) }
        - name: sertakan_penugasan
          in: query
          schema: { type: boolean }
          description: Sertakan penugasan terverifikasi beserta IKU yang disumbangnya
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lecturer' } }

  /lecturers/{uuid}:
    get:
      security: [{ bearerAuth: [lecturers.read] }]
      tags: [Lecturers]
      summary: Satu dosen beserta penugasannya
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: Tidak ditemukan }

  /classes:
    get:
      security: [{ bearerAuth: [classes.read] }]
      tags: [Classes]
      summary: Kelas kuliah pada satu semester
      description: Membutuhkan scope `classes.read`.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - { name: prodi, in: query, schema: { type: string } }
        - name: kolaboratif
          in: query
          schema: { type: boolean }
          description: Hanya kelas ber-case method atau team-based project (IKU 7 penomoran lama; tanpa padanan 2026)
        - name: praktisi
          in: query
          schema: { type: boolean }
          description: Hanya kelas yang diampu bersama praktisi (IKU 4 penomoran lama; tanpa padanan 2026)
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CourseClass' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: 'Kode semester tidak dikenal, atau tidak ada semester aktif' }

  /classes/{uuid}:
    get:
      security: [{ bearerAuth: [classes.read] }]
      tags: [Classes]
      summary: Satu kelas kuliah, lengkap dengan pengajar dan jadwal
      description: |
        Membutuhkan scope `classes.read`. Bentuknya sama dengan satu butir
        `/classes`; tidak dibatasi semester, jadi kelas semester lampau tetap
        dapat dibaca lewat uuid-nya. Satu objek, tidak berhalaman.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CourseClass' }
              example:
                data:
                  uuid: e59d244c-b129-4dcc-9c02-a0a9214562fb
                  semester: "20261"
                  kode_kelas: A
                  mata_kuliah: { kode: IF2103, nama: Basis Data, sks: 3 }
                  prodi: { kode: "55201", nama: Informatika }
                  kuota: 40
                  terisi: 36
                  mode: tatap_muka
                  metode_pembelajaran: { case_method: true, team_based_project: false, kolaboratif: true }
                  status_nilai: belum
                  pengajar:
                    - uuid: 7b29bf23-6746-46e8-94a9-55f4e60bd0a0
                      nama: Lintang Nuraini, S.Kom., M.Kom.
                      nidn: "0406098043"
                      peran: pengampu
                      praktisi: false
                      instansi: null
                    - uuid: 0c1f8e7a-55d2-4b6e-9a1d-3f2b7c9e4d10
                      nama: Bayu Prasetyo
                      nidn: null
                      peran: praktisi
                      praktisi: true
                      instansi: PT Nusantara Digital
                  jadwal:
                    - { hari: Senin, jam_mulai: "07:30", jam_selesai: "10:00", ruang: R-301 }
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: Tidak ditemukan }

  /student-activities:
    get:
      security: [{ bearerAuth: [activities.read] }]
      tags: [Activities]
      summary: Aktivitas MBKM mahasiswa
      description: |
        Membutuhkan scope `activities.read`. Sumber transaksional IKU 3 (Kepmendiktisaintek 358/M/KEP/2025; IKU 2 penomoran lama).

        Ambang 20 SKS **tidak** diterapkan di sisi Open Academic: nilainya
        diatur peraturan menteri dan berubah, jadi keputusannya milik konsumen.
        Bawaannya hanya mengembalikan catatan terverifikasi.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - { name: jenis, in: query, schema: { type: string } }
        - { name: prodi, in: query, schema: { type: string } }
        - { name: min_sks, in: query, schema: { type: integer } }
        - { name: sertakan_belum_verifikasi, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StudentActivity' } }

  /graduates:
    get:
      security: [{ bearerAuth: [graduates.read] }]
      tags: [Graduates]
      summary: Lulusan yang sudah ditetapkan
      description: >-
        Membutuhkan scope `graduates.read`. Populasi awal tracer study IKU 2
        (Kepmendiktisaintek 358/M/KEP/2025; IKU 1 penomoran lama). Blok
        `alumni` memuat `email_pribadi`, `status_pekerjaan` (`belum` = belum
        ditelusuri), `instansi`, `status_pekerjaan_sumber` (`tracer_nasional`,
        `open_campus`, `survei_kampus`), dan `status_pekerjaan_per` (tanggal
        survei) — status diimpor dari hasil tracer, bukan diisi di sini
        (ADR-037 §2).
      parameters:
        - { name: semester, in: query, schema: { type: string } }
        - { name: prodi, in: query, schema: { type: string } }
        - { name: tahun_lulus, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK }

  /iku-data:
    get:
      security: [{ bearerAuth: [students.read, lecturers.read, classes.read, activities.read, graduates.read] }]
      tags: [IKU]
      summary: Cacahan fakta transaksional di balik IKU (penomoran 2026 dan penomoran lama)
      description: |
        Membutuhkan **kelima** scope `students.read`, `lecturers.read`,
        `classes.read`, `activities.read`, dan `graduates.read` — endpoint
        ringkas tidak boleh menjadi jalan pintas membaca data yang scope-nya
        tidak diberikan.

        **Bukan kalkulator IKU.** Tidak ada skor, ambang, maupun target. Setiap
        angka adalah cacah catatan yang juga dikembalikan endpoint daftar,
        dijumlahkan agar dasbor tidak perlu menelusuri seluruh halaman. Angka
        yang bergantung pada ketentuan menteri — ambang 20 SKS MBKM, misalnya —
        dikembalikan per kelompok, dan keputusannya milik konsumen.

        Satu objek, tidak berhalaman. Cacahan per kode (`per_jenis`,
        `per_status_pekerjaan`, `per_jenis_mitra`, `per_status_mahasiswa`)
        berupa objek kode → cacah; **bila tidak ada satu pun catatan, dikirim
        sebagai larik kosong `[]`**, bukan `{}`.

        Lulusan dan efisiensi bersifat kumulatif (seluruh lulusan, seluruh
        mahasiswa aktif); `semester` hanya menyaring `pada_semester_ini` dan
        butir IKU lainnya.

        **Dua penomoran (ADR-036).** `iku_2026` memuat cacahan menurut dua belas
        IKU Kepmendiktisaintek 358/M/KEP/2025, ditambah `ketersediaan`: per
        nomor IKU, apakah faktanya ada di sini (`tersedia`), hanya sebagian
        (`sebagian` — sisanya bukti yang dikumpulkan Open Campus), belum ada
        jenis catatannya (`belum_tersedia`), atau memang bukan catatan akademik
        (`di_luar_cakupan`). `iku_1_efisiensi_edukasi` membaca **tahun
        akademik** tempat semester yang diminta berada, karena IKU 1 diukur per
        tahun. Butir lain per semester; IKU 2026 dinilai per tahun kalender,
        jadi konsumen menjumlahkan semester yang jatuh pada tahun itu.

        Kunci `iku_1_lulusan` … `iku_11_efisiensi` adalah **penomoran lama**
        (delapan IKU) dan **usang**: isinya dibekukan apa adanya agar konsumen
        lama tetap berjalan, tidak ada fakta baru yang ditambahkan ke sana, dan
        baru dihapus pada versi mayor Bridge berikutnya dengan pemberitahuan.
        Padanannya: `iku_1_lulusan` → `iku_2026.iku_2_lulusan`;
        `iku_2_pengalaman_luar_kampus` → `iku_2026.iku_3_kegiatan_luar_prodi`;
        `iku_11_efisiensi` → `iku_2026.iku_1_efisiensi_edukasi` (isinya
        berbeda); `iku_3_dosen_luar_kampus`, `iku_4_praktisi_mengajar`, dan
        `iku_7_kelas_kolaboratif` tidak punya padanan 2026.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - { name: prodi, in: query, schema: { type: string }, description: Kode program studi. Kosong berarti seluruh kampus. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IkuData' }
              example:
                data:
                  semester: "20261"
                  prodi: semua
                  catatan: Cacahan fakta transaksional. Tidak memuat skor, ambang, maupun target — perhitungan indikator dilakukan konsumen.
                  iku_2026:
                    acuan: Kepmendiktisaintek 358/M/KEP/2025
                    ketersediaan:
                      "1": { nama: Angka Efisiensi Edukasi, status: tersedia, kunci: iku_1_efisiensi_edukasi }
                      "2": { nama: "Lulusan bekerja, berwirausaha, atau studi lanjut", status: sebagian, kunci: iku_2_lulusan }
                      "3": { nama: Mahasiswa berkegiatan atau berprestasi di luar program studi, status: tersedia, kunci: iku_3_kegiatan_luar_prodi }
                      "4": { nama: Dosen dengan rekognisi internasional, status: sebagian, kunci: iku_4_rekognisi_dosen }
                      "5": { nama: Luaran kerja sama dan hilirisasi, status: sebagian, kunci: iku_5_luaran_kerja_sama }
                      "6": { nama: Publikasi bereputasi internasional, status: sebagian, kunci: iku_6_publikasi }
                      "7": { nama: Keterlibatan dalam SDGs, status: di_luar_cakupan, kunci: null }
                      "8": { nama: SDM dalam penyusunan kebijakan, status: tersedia, kunci: iku_8_penyusunan_kebijakan }
                      "9": { nama: Pendapatan non-UKT, status: di_luar_cakupan, kunci: null }
                      "10": { nama: Zona Integritas, status: di_luar_cakupan, kunci: null }
                      "11": { nama: Tata kelola dan akuntabilitas, status: di_luar_cakupan, kunci: null }
                      "12": { nama: Perencanaan kesejahteraan dosen, status: di_luar_cakupan, kunci: null }
                    iku_1_efisiensi_edukasi:
                      tahun_akademik: 2026/2027
                      per_jenjang:
                        "30":
                          jenjang: S1
                          masa_studi_standar_semester: 8
                          terdaftar: 2840
