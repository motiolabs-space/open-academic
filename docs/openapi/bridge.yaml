  /teaching-evaluations:
    get:
      security: [{ bearerAuth: [evaluations.read, lecturers.read] }]
      tags: [Evaluations]
      summary: Rekap agregat evaluasi dosen (EDOM)
      description: |
        Membutuhkan scope `evaluations.read` **dan** `lecturers.read` — responsnya
        menyebut dosen, jadi endpoint agregat tidak boleh menjadi jalan memetakan
        nama dosen yang scope-nya tidak diberikan.

        **Yang tidak dapat dikembalikan endpoint ini adalah rancangannya.** Tidak
        ada parameter, tidak ada scope, dan tidak ada jalur kode yang menghasilkan
        satu jawaban, satu komentar bebas, atau identitas pengisi. Tabel jawaban
        memang tidak menyimpan mahasiswa, dan komentar tidak pernah diseleksi di
        sini.

        Kelas yang belum mencapai ambang responden periodenya tidak menyumbang apa
        pun — termasuk cacah respondennya. "0 dari 4 mengisi, rerata 2,1" akan
        memberi tahu konsumen luar lebih banyak tentang kelas berisi empat orang
        daripada yang boleh diketahui siapa pun di dalam Open Academic.
      parameters:
        - $ref: '#/components/parameters/Semester'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      semester: { type: string, example: "20261" }
                      periode:
                        type: [object, 'null']
                        properties:
                          nama: { type: string }
                          mulai: { type: string, format: date }
                          selesai: { type: string, format: date }
                          terbuka: { type: boolean }
                          ambang_responden: { type: integer, example: 5 }
                      catatan: { type: string }
                      dosen:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid: { type: string, format: uuid }
                            nidn: { type: [string, 'null'] }
                            nama: { type: string }
                            kelas_dinilai: { type: integer }
                            jumlah_responden: { type: integer }
                            rerata: { type: [number, 'null'], example: 4.21 }
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: Tidak ada semester aktif; sertakan parameter semester }

  /lecturer-workload:
    get:
      security: [{ bearerAuth: [workload.read, lecturers.read] }]
      tags: [Workload]
      summary: Portofolio & beban kerja dosen (bahan SISTER/BKD)
      description: |
        Membutuhkan scope `workload.read` **dan** `lecturers.read`.

        Dua bentuk dari satu endpoint. Tanpa `nidn`, mengembalikan cacahan
        se-kampus untuk dasbor. Dengan `nidn`, mengembalikan berkas satu dosen —
        granularitas yang dipakai SISTER, sehingga pengiriman yang gagal dapat
        diulang untuk satu orang alih-alih untuk semuanya.

        Konsisten dengan `/iku-data`: ini cacahan catatan yang ada. Tidak ada
        indikator yang dihitung dan tidak ada ambang yang diterapkan. Rentang
        12–16 SKS disertakan sebagai **pengaturan kampus** di samping angkanya,
        bukan diubah menjadi lulus/tidak — konsumen boleh memegang tafsir lain.

        **NIK dan alamat rumah tidak pernah ikut**, di bentuk mana pun. Bentuk
        yang sama dipakai ekspor CSV dan berkas JSON yang dikirim lewat surel;
        payload yang aman di satu kanal dan tidak di kanal lain akan bocor lewat
        kanal yang paling ceroboh.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - name: nidn
          in: query
          schema: { type: string }
          description: Bila diisi, mengembalikan berkas satu dosen alih-alih cacahan kampus.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: |
                      Bentuk kampus memuat `pelaporan_bkd`, `beban_kerja`,
                      `kegiatan_dosen`, `luaran`, dan `batas_kampus`. Bentuk
                      per-dosen memuat `dosen` (riwayat pendidikan, jabatan,
                      sertifikasi) dan `semester` (kegiatan beserta laporan BKD).
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: 'NIDN tidak ditemukan, atau tidak ada semester aktif' }

  /academic-terms:
    get:
      security: [{ bearerAuth: [terms.read] }]
      tags: [Terms]
      summary: Seluruh tahun akademik
      description: Membutuhkan scope `terms.read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AcademicTerm' } }

  /academic-terms/current:
    get:
      security: [{ bearerAuth: [terms.read] }]
      tags: [Terms]
      summary: Semester yang sedang aktif
      responses:
        '200': { description: OK }
        '404': { description: Belum ada semester aktif }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum yang diterbitkan dari layar /admin/bridge (Kelola) atau `php artisan openacademic:bridge-token {slug}`

  parameters:
    Semester:
      name: semester
      in: query
      schema: { type: string, example: "20261" }
      description: Kode semester PDDIKTI. Bila dikosongkan, memakai semester aktif.
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }

  responses:
    ScopeDitolak:
      description: Token tidak memiliki scope yang dibutuhkan
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, "null"] }
        to: { type: [integer, "null"] }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        path: { type: string, format: uri }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, format: uri }
        last: { type: string, format: uri }
        prev: { type: [string, "null"], format: uri }
        next: { type: [string, "null"], format: uri }

    Student:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        nim: { type: string }
        nama: { type: string }
        email: { type: string, format: email }
        angkatan: { type: integer }
        status:
          type: object
          properties:
            kode: { type: string, example: "A" }
            label: { type: string, example: "Aktif" }
            aktif: { type: boolean }
        prodi: { $ref: '#/components/schemas/ProdiRingkas' }
        dosen_wali:
          type: [object, "null"]
          properties:
            uuid: { type: string }
            nama: { type: string }
        foto_url: { type: [string, "null"] }
        riwayat_semester:
          type: array
          description: Hanya ada bila diminta dengan sertakan_riwayat
          items:
            type: object
            properties:
              semester: { type: string }
              semester_ke: { type: integer }
              status: { type: string }
              ips: { type: number }
              ipk: { type: number }
              sks_semester: { type: integer }
              sks_kumulatif: { type: integer }
              final: { type: boolean }

    Lecturer:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        nidn: { type: [string, "null"] }
        nama: { type: string }
        nama_lengkap: { type: string }
        jabatan_fungsional: { type: [string, "null"] }
        praktisi:
          type: object
          properties:
            ya: { type: boolean }
            instansi: { type: [string, "null"] }
        penugasan:
          type: array
          items:
            type: object
            properties:
              jenis: { type: string }
              judul: { type: string }
              mitra: { type: [string, "null"] }
              sks_ekuivalen: { type: [number, "null"] }
              terverifikasi: { type: boolean }
              iku:
                type: array
                description: IKU yang disumbang catatan ini, **penomoran lama** (3 = dosen di luar kampus, 4 = praktisi mengajar). Keduanya tanpa padanan 2026; medan dibekukan (ADR-036).
                items: { type: integer, enum: [3, 4] }

    CourseClass:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        semester: { type: string, example: "20261" }
        kode_kelas: { type: string }
        mata_kuliah:
          type: object
          properties:
            kode: { type: string }
            nama: { type: string }
            sks: { type: integer }
        prodi:
          type: object
          properties:
            kode: { type: string }
            nama: { type: string }
        kuota: { type: integer }
        terisi: { type: integer }
        mode: { type: string, enum: [tatap_muka, daring, hybrid] }
        metode_pembelajaran:
          type: object
          description: Metode kelas kolaboratif (IKU 7 penomoran lama; tanpa padanan 2026)
          properties:
            case_method: { type: boolean }
            team_based_project: { type: boolean }
            kolaboratif: { type: boolean }
        status_nilai: { type: string, enum: [belum, sebagian, final] }
        pengajar:
          type: array
          description: Praktisi pengajar lewat `peran = praktisi` (IKU 4 penomoran lama)
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              nama: { type: string, description: Nama lengkap beserta gelar }
              nidn: { type: [string, "null"] }
              peran: { type: string, enum: [pengampu, pendamping, praktisi] }
              praktisi: { type: boolean }
              instansi: { type: [string, "null"], description: Instansi asal praktisi }
        jadwal:
          type: array
          items:
            type: object
            properties:
              hari: { type: string, example: Senin }
              jam_mulai: { type: string, example: "07:30" }
              jam_selesai: { type: string, example: "10:00" }
              ruang: { type: [string, "null"], description: Kode ruang }

    StudentActivity:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        semester: { type: string }
        mahasiswa:
          type: object
          properties:
            uuid: { type: string }
            nim: { type: string }
            nama: { type: string }
        jenis: { type: string, example: magang }
        jenis_label: { type: string }
        judul: { type: string }
        sks_konversi: { type: integer }
        terverifikasi: { type: boolean }

    AcademicTerm:
      type: object
      properties:
        kode: { type: string, example: "20261" }
        nama: { type: string, example: "2026/2027 Ganjil" }
        semester: { type: string, enum: [Ganjil, Genap, Antara] }
        aktif: { type: boolean }
        jendela:
          type: object
          properties:
            krs_dibuka: { type: boolean }
            penilaian_dibuka: { type: boolean }

    ProdiRingkas:
      type: object
      properties:
        kode: { type: string }
        nama: { type: string }
        jenjang: { type: string }

    CacahPerKode:
      description: Kode → cacah. Dikirim sebagai `[]` bila tidak ada satu pun catatan.
      oneOf:
        - type: object
          additionalProperties: { type: integer }
        - type: array
          maxItems: 0

    CacahPenugasan:
      type: object
      properties:
        total_penugasan: { type: integer }
        dosen_terlibat: { type: integer }
        per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
        per_jenis_mitra: { $ref: '#/components/schemas/CacahPerKode' }

    IkuData:
      type: object
      properties:
        semester: { type: string, example: "20261" }
        prodi: { type: string, description: 'Kode prodi yang diminta, atau `semua`' }
        catatan: { type: string }
        iku_2026: { $ref: '#/components/schemas/Iku2026' }
        iku_1_lulusan:
          type: object
          deprecated: true
          description: Penomoran lama. Padanan 2026 — `iku_2026.iku_2_lulusan`.
          properties:
            total_lulusan: { type: integer }
            pada_semester_ini: { type: integer }
            per_status_pekerjaan: { $ref: '#/components/schemas/CacahPerKode' }
            rata_ipk: { type: number, description: 0 bila belum ada lulusan }
        iku_2_pengalaman_luar_kampus:
          type: object
          deprecated: true
          description: Penomoran lama. Padanan 2026 — `iku_2026.iku_3_kegiatan_luar_prodi` (pita SKS berbeda).
          properties:
            total_catatan: { type: integer }
            terverifikasi: { type: integer }
            belum_terverifikasi: { type: integer }
            mahasiswa_terlibat: { type: integer, description: Dari catatan terverifikasi }
            per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
            per_sks_konversi:
              type: object
              description: Dikelompokkan, bukan diambangi — ambangnya milik konsumen.
              properties:
                "0-5": { type: integer }
                "6-19": { type: integer }
                "20+": { type: integer }
        iku_3_dosen_luar_kampus:
          deprecated: true
          description: Penomoran lama. Tidak ada padanan 2026.
          allOf: [{ $ref: '#/components/schemas/CacahPenugasan' }]
        iku_4_praktisi_mengajar:
          type: object
          deprecated: true
          description: Penomoran lama. Tidak ada padanan 2026.
          properties:
            total_kelas: { type: integer }
            kelas_dengan_praktisi: { type: integer }
            praktisi_terlibat: { type: integer }
            penugasan_praktisi_mengajar: { $ref: '#/components/schemas/CacahPenugasan' }
        iku_7_kelas_kolaboratif:
          type: object
          deprecated: true
          description: Penomoran lama. Tidak ada padanan 2026.
          properties:
            total_kelas: { type: integer }
            case_method: { type: integer }
            team_based_project: { type: integer }
            keduanya: { type: integer }
            salah_satu: { type: integer }
        iku_11_efisiensi:
          type: object
          deprecated: true
          description: Usang. IKU 1 2026 (AEE) dibaca dari `iku_2026.iku_1_efisiensi_edukasi`.
          properties:
            mahasiswa_aktif: { type: integer }
            dosen_aktif_ber_nidn: { type: integer }
            rasio_dosen_mahasiswa: { type: [number, "null"], description: Null bila tidak ada dosen ber-NIDN }
            per_status_mahasiswa: { $ref: '#/components/schemas/CacahPerKode' }
            jumlah_prodi: { type: integer }

    Iku2026:
      type: object
      description: Cacahan menurut Kepmendiktisaintek 358/M/KEP/2025 (ADR-036). Tanpa bobot, ambang, maupun skor.
      properties:
        acuan: { type: string, example: Kepmendiktisaintek 358/M/KEP/2025 }
        ketersediaan:
          type: object
          description: Nomor IKU 1–12 → nama, status ketersediaan data di Open Academic, dan kunci butirnya (null bila tidak ada).
          additionalProperties:
            type: object
            properties:
              nama: { type: string }
              status: { type: string, enum: [tersedia, sebagian, belum_tersedia, di_luar_cakupan] }
              kunci: { type: [string, "null"] }
        iku_1_efisiensi_edukasi:
          type: object
          properties:
            tahun_akademik: { type: string, example: 2026/2027 }
            per_jenjang:
              description: Kode jenjang PDDIKTI → cacahan. Larik kosong `[]` bila tidak ada.
              type: [object, array]
              additionalProperties:
                type: object
                properties:
                  jenjang: { type: string }
                  masa_studi_standar_semester: { type: integer }
                  terdaftar: { type: integer, description: Mahasiswa yang punya status semester pada tahun akademik itu; status terakhir di tahun itu yang dihitung }
                  terdaftar_per_status: { $ref: '#/components/schemas/CacahPerKode' }
                  lulus: { type: integer }
                  lulus_pindahan: { type: integer }
                  lulus_per_lama_studi:
                    type: array
                    description: Semester reguler di kampus ini, semester masuk dan lulus ikut dihitung; 0 bila salah satunya tidak tercatat.
                    items:
                      type: object
                      properties:
                        semester: { type: integer }
                        lulus: { type: integer }
        iku_2_lulusan:
          type: object
          description: >-
            Populasi tracer study dan status pekerjaan yang diimpor dari hasil
            tracer study nasional atau Open Campus (ADR-037 §2). `belum` dan
            tanpa baris alumni sama-sama `belum_ditelusuri`. Masa tunggu
            dipitakan untuk yang bekerja atau berwirausaha. Persentase IKU 2
            dan ambang gaji milik konsumen.
          properties:
            total_lulusan: { type: integer }
            pada_semester_ini: { type: integer }
            per_jenjang: { $ref: '#/components/schemas/CacahPerKode' }
            per_tahun_lulus: { $ref: '#/components/schemas/CacahPerKode' }
            per_status_pekerjaan: { $ref: '#/components/schemas/CacahPerKode' }
            ditelusuri: { type: integer }
            per_sumber_status: { $ref: '#/components/schemas/CacahPerKode' }
            masa_tunggu_bulan:
              type: object
              properties:
                "0-6": { type: integer }
                "7-12": { type: integer }
                "13+": { type: integer }
                tidak_diketahui: { type: integer }
        iku_3_kegiatan_luar_prodi:
          type: object
          properties:
            mahasiswa_aktif_per_jenjang: { $ref: '#/components/schemas/CacahPerKode' }
            pembelajaran:
              type: object
              properties:
                catatan_terverifikasi: { type: integer }
                mahasiswa_terlibat: { type: integer }
                mahasiswa_terlibat_per_jenjang: { $ref: '#/components/schemas/CacahPerKode' }
                per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
                mahasiswa_per_sks_konversi:
                  type: object
                  description: SKS konversi dijumlahkan per mahasiswa, lalu dikelompokkan menurut pita Kepmen 358 — bobotnya milik konsumen.
                  properties:
                    "0-5": { type: integer }
                    "6-10": { type: integer }
                    "11+": { type: integer }
            prestasi:
              type: object
              description: Prestasi terverifikasi dari buku poin kemahasiswaan.
              properties:
                catatan_terverifikasi: { type: integer }
                mahasiswa_terlibat: { type: integer }
                per_tingkat: { $ref: '#/components/schemas/CacahPerKode' }
                per_kategori: { $ref: '#/components/schemas/CacahPerKode' }
        iku_4_rekognisi_dosen:
          type: object
          description: Luaran dosen bertingkat internasional. Bukti rekognisi (sitasi, penghargaan, pemakaian) tidak dicatat di sini.
          properties:
            luaran_internasional: { type: integer }
            dosen_terlibat: { type: integer }
            dosen_terlibat_ber_nuptk: { type: integer }
            dosen_aktif_ber_nuptk: { type: integer }
            per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
        iku_5_luaran_kerja_sama:
          type: object
          description: Luaran dosen yang menyebut mitra. Bukti pemanfaatan oleh mitra tidak dicatat di sini.
          properties:
            total_luaran: { type: integer }
            luaran_bermitra: { type: integer }
            per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
            per_jenis_mitra: { $ref: '#/components/schemas/CacahPerKode' }
        iku_6_publikasi:
          type: object
          description: >-
            Artikel jurnal dan prosiding terverifikasi. Indeks, kuartil, DOI, dan
            kolaborasi internasional dinyatakan dosen dan diverifikasi staf;
            tidak ada yang dicari ke layanan pengindeks (ADR-041 §2).
            `total_publikasi`, `per_jenis`, dan `per_tingkat` menghitung baris;
            medan lain menghitung **artikel** — baris ber-DOI sama dari beberapa
            penulis kampus ini dihitung sekali, baris tanpa DOI berdiri sendiri.
            Bobot kuartil, kelas top tier, tambahan kolaborasi, dan penerbit yang
            dikecualikan Kepmen 358 milik konsumen.
          properties:
            total_publikasi: { type: integer }
            per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
            per_tingkat: { $ref: '#/components/schemas/CacahPerKode' }
            publikasi_unik: { type: integer, description: Artikel setelah baris ber-DOI sama digabung. }
            ber_doi: { type: integer, description: Artikel yang punya DOI — seberapa jauh penggabungan dapat dipercaya. }
            per_indeks: { $ref: '#/components/schemas/CacahPerKode' }
            bereputasi_internasional: { type: integer, description: Artikel terindeks Scopus atau Web of Science. }
            jurnal_bereputasi_per_kuartil: { $ref: '#/components/schemas/CacahPerKode' }
            prosiding_bereputasi: { type: integer }
            bereputasi_kolaborasi_internasional: { type: integer, description: Artikel bereputasi dengan penulis dari luar negeri. }
        iku_8_penyusunan_kebijakan:
          type: object
          description: >-
            Keterlibatan dosen yang terverifikasi dalam penyusunan kebijakan
            (ADR-041 §1): anggota tim penyusun, narasumber atau ahli resmi, atau
            kontributor kajian, dengan dokumen resmi yang mencantumkan namanya.
            Dosen dihitung sekali berapa pun kebijakannya. Kepmen 358 menyebut
            tingkat nasional, daerah, dan industri; `internasional` ikut dicatat
            dan konsumen yang memutuskan apakah dihitung. Persentase milik konsumen.
          properties:
            keterlibatan_terverifikasi: { type: integer }
            dosen_terlibat: { type: integer }
            dosen_tetap_terlibat: { type: integer, description: Dosen berstatus kepegawaian tetap — populasi IKU 8. }
            dosen_tetap_aktif: { type: integer, description: Penyebut — dosen tetap yang aktif. }
            per_bentuk: { $ref: '#/components/schemas/CacahPerKode' }
            per_tingkat: { $ref: '#/components/schemas/CacahPerKode' }

  # ---------------------------------------------------------------------------
  # Webhook — sisi dorong dari kontrak ini
  # ---------------------------------------------------------------------------
  x-webhooks:
    description: |
      Konsumen mendaftarkan satu URL dan daftar event. Setiap kiriman
      ditandatangani HMAC-SHA256 atas `{timestamp}.{body}` memakai rahasia
      milik konsumen, dikirim pada header:

        X-OpenAcademic-Signature: <hex hmac>
        X-OpenAcademic-Timestamp: <unix timestamp>

      Timestamp ikut ditandatangani agar kiriman yang tertangkap tidak dapat
      diputar ulang dengan timestamp baru. Verifikasi wajib memakai perbandingan
      waktu-tetap (`hash_equals`), bukan `==`.

      Balasan 2xx dianggap berhasil. Selain itu dicoba ulang dengan jeda
      bertingkat 60s, 5m, 15m, 1j, 6j lalu menyerah dan menunggu pemutaran
      ulang manual dari konsol.
    events:
      - student.enrolled
      - student.status_changed
      - krs.approved
      - grade.finalized
      - student.graduated
      - activity.recorded
      - lecturer.assignment_recorded
    envelope:
      type: object
      properties:
        id: { type: string, format: uuid, description: Untuk mendeteksi kiriman ganda }
        event: { type: string }
        occurred_at: { type: string, format: date-time }
        institution: { type: string, description: Kode perguruan tinggi PDDIKTI }
        data: { type: object }
    # Muatan `data` per event. Hanya event yang muatannya dipaku tes yang
    # dicantumkan di sini; tes StudentEnrolledTest membandingkan kunci yang
    # benar-benar diterbitkan dengan daftar properti ini.
    payloads:
      student.enrolled:
        description: |
          Mahasiswa baru terbentuk — daftar ulang PMB (termasuk pindahan lewat
          PMB), intake pindahan/RPL langsung, atau registrasi baru lewat pindah
          prodi internal / masuk kembali (lihat `mahasiswa_sebelumnya_uuid`). Terbit satu kali per
          mahasiswa, sesudah transaksi pendaftarannya selesai. Adopsi dan klaim
          data PDDIKTI lama tidak menerbitkan event ini; mahasiswa yang sudah
          ada sebelumnya dibaca lewat `GET /students`.
        type: object
        required: [mahasiswa_uuid, nim, nama, prodi, angkatan, semester_masuk, status]
        properties:
          mahasiswa_uuid: { type: string, format: uuid }
          nim: { type: string }
          nama: { type: string }
          email: { type: [string, "null"] }
          prodi: { type: string, description: Kode program studi }
          angkatan: { type: integer }
          semester_masuk: { type: string, description: "Kode semester PDDIKTI, mis. 20261" }
          jenis_daftar: { type: [string, "null"], description: "baru | pindahan | rpl_transfer | rpl_perolehan | fast_track | non_gelar | pindah_prodi | masuk_kembali" }
          status: { type: string, description: "Kode status mahasiswa, mis. A" }
          mahasiswa_sebelumnya_uuid:
            type: [string, "null"]
            format: uuid
            description: |
              Registrasi sebelumnya dari orang yang sama, bila registrasi ini dibuka
              lewat pindah prodi internal atau masuk kembali (NIM baru). Akun lama
              tetap ada dengan NIM lamanya; pindah prodi juga menerbitkan
              `student.status_changed` untuk akun lama (status `G`). Null untuk
              mahasiswa yang baru pertama kali terdaftar.
      student.status_changed:
        description: |
          Status mahasiswa berubah: yudisium (menunggu uji kompetensi, lulus),
          cuti disetujui BAAK, aktif kembali dari cuti, pindah prodi internal
          (registrasi lama menjadi `G`), dan aktif kembali dengan NIM yang sama
          sesudah keluar (ADR-042 §3). Terbit sesudah
          transaksi keputusannya selesai — ajuan yang belum diputus tidak
          menerbitkan apa pun.
        type: object
        required: [mahasiswa_uuid, nim, status_lama, status_baru]
        properties:
