openapi: 3.1.0

info:
  title: Open Academic — Campus Bridge API
  version: "1.0.0"
  description: |
    Satu-satunya jalan resmi bagi sistem lain untuk membaca data akademik
    Open Academic. Basis data tidak pernah dibagi: konsumen memegang token
    Sanctum ber-scope dan berbicara lewat HTTPS.

    **Spec-first.** Ubah berkas ini lebih dulu, baru kodenya.

    ### Otorisasi
    Setiap endpoint menyatakan scope yang dibutuhkannya. Daftar scope melekat
    pada aplikasi konsumen, bukan pada token — mencabut scope berlaku seketika
    tanpa perlu menerbitkan token baru. Scope tiap operasi tercantum pada
    `security`-nya (daftar peran skema bearer, OpenAPI 3.1); seluruhnya wajib
    dimiliki.

    ### Batas privasi
    Payload sengaja lebih sempit dari model internalnya. NIK, alamat rumah,
    nama orang tua, dan penghasilan keluarga dikumpulkan untuk pelaporan
    PDDIKTI, bukan untuk platform engagement, dan tidak pernah dikirim lewat
    Bridge.

    ### Kunci semester
    Semester selalu direferensikan dengan kode PDDIKTI (`20261` = 2026/2027
    Ganjil), tidak pernah dengan id internal.
  license:
    name: MIT

servers:
  - url: https://{host}/api/bridge/v1
    variables:
      host:
        default: akademik.kampus.ac.id

security:
  - bearerAuth: []

tags:
  - name: Students
  - name: Lecturers
  - name: Classes
  - name: Activities
  - name: Graduates
  - name: Terms
  - name: Evaluations
  - name: Workload
  - name: IKU

paths:
  /students:
    get:
      security: [{ bearerAuth: [students.read] }]
      tags: [Students]
      summary: Daftar mahasiswa
      description: Membutuhkan scope `students.read`.
      parameters:
        - { name: prodi, in: query, schema: { type: string }, description: Kode program studi }
        - { name: angkatan, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [A, C, N, L, D, K, G] } }
        - { name: cari, in: query, schema: { type: string }, description: Cocokkan nama atau NIM }
        - name: sertakan_riwayat
          in: query
          schema: { type: boolean }
          description: Sertakan riwayat IPS/IPK per semester. Dibutuhkan mesin IKU; mahal untuk direktori biasa.
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Student' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/ScopeDitolak' }

  /students/{uuid}:
    get:
      security: [{ bearerAuth: [students.read] }]
      tags: [Students]
      summary: Satu mahasiswa, lengkap dengan riwayat semester
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Student' }
        '404': { description: Tidak ditemukan }

  /students/statistics:
    get:
      security: [{ bearerAuth: [students.read] }]
      tags: [Students]
      summary: Cacah agregat per status dan per program studi
      description: Agar dasbor tidak perlu menelusuri seluruh halaman hanya untuk menghitung.
      responses:
        '200': { description: OK }

  /lecturers:
    get:
      security: [{ bearerAuth: [lecturers.read] }]
      tags: [Lecturers]
      summary: Daftar dosen
      description: Membutuhkan scope `lecturers.read`.
      parameters:
        - { name: prodi, in: query, schema: { type: string } }
        - { name: praktisi, in: query, schema: { type: boolean }, description: Hanya praktisi dari industri (populasi IKU 4) }
        - name: sertakan_penugasan
          in: query
          schema: { type: boolean }
          description: Sertakan penugasan terverifikasi beserta IKU yang disumbangnya
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lecturer' } }

  /lecturers/{uuid}:
    get:
      security: [{ bearerAuth: [lecturers.read] }]
      tags: [Lecturers]
      summary: Satu dosen beserta penugasannya
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: Tidak ditemukan }

  /classes:
    get:
      security: [{ bearerAuth: [classes.read] }]
      tags: [Classes]
      summary: Kelas kuliah pada satu semester
      description: Membutuhkan scope `classes.read`.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - { name: prodi, in: query, schema: { type: string } }
        - name: kolaboratif
          in: query
          schema: { type: boolean }
          description: Hanya kelas ber-case method atau team-based project (bukti IKU 7)
        - name: praktisi
          in: query
          schema: { type: boolean }
          description: Hanya kelas yang diampu bersama praktisi (bukti IKU 4)
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CourseClass' } }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: 'Kode semester tidak dikenal, atau tidak ada semester aktif' }

  /classes/{uuid}:
    get:
      security: [{ bearerAuth: [classes.read] }]
      tags: [Classes]
      summary: Satu kelas kuliah, lengkap dengan pengajar dan jadwal
      description: |
        Membutuhkan scope `classes.read`. Bentuknya sama dengan satu butir
        `/classes`; tidak dibatasi semester, jadi kelas semester lampau tetap
        dapat dibaca lewat uuid-nya. Satu objek, tidak berhalaman.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CourseClass' }
              example:
                data:
                  uuid: e59d244c-b129-4dcc-9c02-a0a9214562fb
                  semester: "20261"
                  kode_kelas: A
                  mata_kuliah: { kode: IF2103, nama: Basis Data, sks: 3 }
                  prodi: { kode: "55201", nama: Informatika }
                  kuota: 40
                  terisi: 36
                  mode: tatap_muka
                  metode_pembelajaran: { case_method: true, team_based_project: false, kolaboratif: true }
                  status_nilai: belum
                  pengajar:
                    - uuid: 7b29bf23-6746-46e8-94a9-55f4e60bd0a0
                      nama: Lintang Nuraini, S.Kom., M.Kom.
                      nidn: "0406098043"
                      peran: pengampu
                      praktisi: false
                      instansi: null
                    - uuid: 0c1f8e7a-55d2-4b6e-9a1d-3f2b7c9e4d10
                      nama: Bayu Prasetyo
                      nidn: null
                      peran: praktisi
                      praktisi: true
                      instansi: PT Nusantara Digital
                  jadwal:
                    - { hari: Senin, jam_mulai: "07:30", jam_selesai: "10:00", ruang: R-301 }
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: Tidak ditemukan }

  /student-activities:
    get:
      security: [{ bearerAuth: [activities.read] }]
      tags: [Activities]
      summary: Aktivitas MBKM mahasiswa
      description: |
        Membutuhkan scope `activities.read`. Sumber transaksional IKU 2.

        Ambang 20 SKS **tidak** diterapkan di sisi Open Academic: nilainya
        diatur peraturan menteri dan berubah, jadi keputusannya milik konsumen.
        Bawaannya hanya mengembalikan catatan terverifikasi.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - { name: jenis, in: query, schema: { type: string } }
        - { name: prodi, in: query, schema: { type: string } }
        - { name: min_sks, in: query, schema: { type: integer } }
        - { name: sertakan_belum_verifikasi, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StudentActivity' } }

  /graduates:
    get:
      security: [{ bearerAuth: [graduates.read] }]
      tags: [Graduates]
      summary: Lulusan yang sudah ditetapkan
      description: Membutuhkan scope `graduates.read`. Populasi awal tracer study IKU 1.
      parameters:
        - { name: semester, in: query, schema: { type: string } }
        - { name: prodi, in: query, schema: { type: string } }
        - { name: tahun_lulus, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK }

  /iku-data:
    get:
      security: [{ bearerAuth: [students.read, lecturers.read, classes.read, activities.read, graduates.read] }]
      tags: [IKU]
      summary: Cacahan fakta transaksional di balik IKU 1, 2, 3, 4, 7, dan 11
      description: |
        Membutuhkan **kelima** scope `students.read`, `lecturers.read`,
        `classes.read`, `activities.read`, dan `graduates.read` — endpoint
        ringkas tidak boleh menjadi jalan pintas membaca data yang scope-nya
        tidak diberikan.

        **Bukan kalkulator IKU.** Tidak ada skor, ambang, maupun target. Setiap
        angka adalah cacah catatan yang juga dikembalikan endpoint daftar,
        dijumlahkan agar dasbor tidak perlu menelusuri seluruh halaman. Angka
        yang bergantung pada ketentuan menteri — ambang 20 SKS MBKM, misalnya —
        dikembalikan per kelompok, dan keputusannya milik konsumen.

        Satu objek, tidak berhalaman. Cacahan per kode (`per_jenis`,
        `per_status_pekerjaan`, `per_jenis_mitra`, `per_status_mahasiswa`)
        berupa objek kode → cacah; **bila tidak ada satu pun catatan, dikirim
        sebagai larik kosong `[]`**, bukan `{}`.

        Lulusan dan efisiensi bersifat kumulatif (seluruh lulusan, seluruh
        mahasiswa aktif); `semester` hanya menyaring `pada_semester_ini` dan
        butir IKU lainnya.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - { name: prodi, in: query, schema: { type: string }, description: Kode program studi. Kosong berarti seluruh kampus. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IkuData' }
              example:
                data:
                  semester: "20261"
                  prodi: semua
                  catatan: Cacahan fakta transaksional. Tidak memuat skor, ambang, maupun target — perhitungan indikator dilakukan konsumen.
                  iku_1_lulusan:
                    total_lulusan: 412
                    pada_semester_ini: 58
                    per_status_pekerjaan: { bekerja: 190, wirausaha: 21, studi_lanjut: 12, belum_ditelusuri: 189 }
                    rata_ipk: 3.41
                  iku_2_pengalaman_luar_kampus:
                    total_catatan: 96
                    terverifikasi: 88
                    belum_terverifikasi: 8
                    mahasiswa_terlibat: 81
                    per_jenis: { magang: 54, studi_independen: 20, pertukaran_pelajar: 14 }
                    per_sks_konversi: { "0-5": 9, "6-19": 17, "20+": 62 }
                  iku_3_dosen_luar_kampus:
                    total_penugasan: 14
                    dosen_terlibat: 11
                    per_jenis: { tugas_industri: 8, penelitian: 4, pengabdian: 2 }
                    per_jenis_mitra: { industri: 8, kampus: 6 }
                  iku_4_praktisi_mengajar:
                    total_kelas: 240
                    kelas_dengan_praktisi: 19
                    praktisi_terlibat: 12
                    penugasan_praktisi_mengajar:
                      total_penugasan: 12
                      dosen_terlibat: 12
                      per_jenis: { praktisi_mengajar: 12 }
                      per_jenis_mitra: { industri: 12 }
                  iku_7_kelas_kolaboratif:
                    total_kelas: 240
                    case_method: 61
                    team_based_project: 44
                    keduanya: 12
                    salah_satu: 93
                  iku_11_efisiensi:
                    mahasiswa_aktif: 3120
                    dosen_aktif_ber_nidn: 104
                    rasio_dosen_mahasiswa: 30
                    per_status_mahasiswa: { A: 3120, C: 41, N: 77, L: 412 }
                    jumlah_prodi: 9
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: 'Kode semester tidak dikenal, atau tidak ada semester aktif' }

  /teaching-evaluations:
    get:
      security: [{ bearerAuth: [evaluations.read, lecturers.read] }]
      tags: [Evaluations]
      summary: Rekap agregat evaluasi dosen (EDOM)
      description: |
        Membutuhkan scope `evaluations.read` **dan** `lecturers.read` — responsnya
        menyebut dosen, jadi endpoint agregat tidak boleh menjadi jalan memetakan
        nama dosen yang scope-nya tidak diberikan.

        **Yang tidak dapat dikembalikan endpoint ini adalah rancangannya.** Tidak
        ada parameter, tidak ada scope, dan tidak ada jalur kode yang menghasilkan
        satu jawaban, satu komentar bebas, atau identitas pengisi. Tabel jawaban
        memang tidak menyimpan mahasiswa, dan komentar tidak pernah diseleksi di
        sini.

        Kelas yang belum mencapai ambang responden periodenya tidak menyumbang apa
        pun — termasuk cacah respondennya. "0 dari 4 mengisi, rerata 2,1" akan
        memberi tahu konsumen luar lebih banyak tentang kelas berisi empat orang
        daripada yang boleh diketahui siapa pun di dalam Open Academic.
      parameters:
        - $ref: '#/components/parameters/Semester'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      semester: { type: string, example: "20261" }
                      periode:
                        type: [object, 'null']
                        properties:
                          nama: { type: string }
                          mulai: { type: string, format: date }
                          selesai: { type: string, format: date }
                          terbuka: { type: boolean }
                          ambang_responden: { type: integer, example: 5 }
                      catatan: { type: string }
                      dosen:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid: { type: string, format: uuid }
                            nidn: { type: [string, 'null'] }
                            nama: { type: string }
                            kelas_dinilai: { type: integer }
                            jumlah_responden: { type: integer }
                            rerata: { type: [number, 'null'], example: 4.21 }
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: Tidak ada semester aktif; sertakan parameter semester }

  /lecturer-workload:
    get:
      security: [{ bearerAuth: [workload.read, lecturers.read] }]
      tags: [Workload]
      summary: Portofolio & beban kerja dosen (bahan SISTER/BKD)
      description: |
        Membutuhkan scope `workload.read` **dan** `lecturers.read`.

        Dua bentuk dari satu endpoint. Tanpa `nidn`, mengembalikan cacahan
        se-kampus untuk dasbor. Dengan `nidn`, mengembalikan berkas satu dosen —
        granularitas yang dipakai SISTER, sehingga pengiriman yang gagal dapat
        diulang untuk satu orang alih-alih untuk semuanya.

        Konsisten dengan `/iku-data`: ini cacahan catatan yang ada. Tidak ada
        indikator yang dihitung dan tidak ada ambang yang diterapkan. Rentang
        12–16 SKS disertakan sebagai **pengaturan kampus** di samping angkanya,
        bukan diubah menjadi lulus/tidak — konsumen boleh memegang tafsir lain.

        **NIK dan alamat rumah tidak pernah ikut**, di bentuk mana pun. Bentuk
        yang sama dipakai ekspor CSV dan berkas JSON yang dikirim lewat surel;
        payload yang aman di satu kanal dan tidak di kanal lain akan bocor lewat
        kanal yang paling ceroboh.
      parameters:
        - $ref: '#/components/parameters/Semester'
        - name: nidn
          in: query
          schema: { type: string }
          description: Bila diisi, mengembalikan berkas satu dosen alih-alih cacahan kampus.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: |
                      Bentuk kampus memuat `pelaporan_bkd`, `beban_kerja`,
                      `kegiatan_dosen`, `luaran`, dan `batas_kampus`. Bentuk
                      per-dosen memuat `dosen` (riwayat pendidikan, jabatan,
                      sertifikasi) dan `semester` (kegiatan beserta laporan BKD).
        '403': { $ref: '#/components/responses/ScopeDitolak' }
        '404': { description: 'NIDN tidak ditemukan, atau tidak ada semester aktif' }

  /academic-terms:
    get:
      security: [{ bearerAuth: [terms.read] }]
      tags: [Terms]
      summary: Seluruh tahun akademik
      description: Membutuhkan scope `terms.read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AcademicTerm' } }

  /academic-terms/current:
    get:
      security: [{ bearerAuth: [terms.read] }]
      tags: [Terms]
      summary: Semester yang sedang aktif
      responses:
        '200': { description: OK }
        '404': { description: Belum ada semester aktif }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum yang diterbitkan `php artisan openacademic:bridge-token {slug}`

  parameters:
    Semester:
      name: semester
      in: query
      schema: { type: string, example: "20261" }
      description: Kode semester PDDIKTI. Bila dikosongkan, memakai semester aktif.
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }

  responses:
    ScopeDitolak:
      description: Token tidak memiliki scope yang dibutuhkan
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, "null"] }
        to: { type: [integer, "null"] }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        path: { type: string, format: uri }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, format: uri }
        last: { type: string, format: uri }
        prev: { type: [string, "null"], format: uri }
        next: { type: [string, "null"], format: uri }

    Student:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        nim: { type: string }
        nama: { type: string }
        email: { type: string, format: email }
        angkatan: { type: integer }
        status:
          type: object
          properties:
            kode: { type: string, example: "A" }
            label: { type: string, example: "Aktif" }
            aktif: { type: boolean }
        prodi: { $ref: '#/components/schemas/ProdiRingkas' }
        dosen_wali:
          type: [object, "null"]
          properties:
            uuid: { type: string }
            nama: { type: string }
        foto_url: { type: [string, "null"] }
        riwayat_semester:
          type: array
          description: Hanya ada bila diminta dengan sertakan_riwayat
          items:
            type: object
            properties:
              semester: { type: string }
              semester_ke: { type: integer }
              status: { type: string }
              ips: { type: number }
              ipk: { type: number }
              sks_semester: { type: integer }
              sks_kumulatif: { type: integer }
              final: { type: boolean }

    Lecturer:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        nidn: { type: [string, "null"] }
        nama: { type: string }
        nama_lengkap: { type: string }
        jabatan_fungsional: { type: [string, "null"] }
        praktisi:
          type: object
          properties:
            ya: { type: boolean }
            instansi: { type: [string, "null"] }
        penugasan:
          type: array
          items:
            type: object
            properties:
              jenis: { type: string }
              judul: { type: string }
              mitra: { type: [string, "null"] }
              sks_ekuivalen: { type: [number, "null"] }
              terverifikasi: { type: boolean }
              iku:
                type: array
                description: IKU yang disumbang catatan ini
                items: { type: integer, enum: [3, 4] }

    CourseClass:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        semester: { type: string, example: "20261" }
        kode_kelas: { type: string }
        mata_kuliah:
          type: object
          properties:
            kode: { type: string }
            nama: { type: string }
            sks: { type: integer }
        prodi:
          type: object
          properties:
            kode: { type: string }
            nama: { type: string }
        kuota: { type: integer }
        terisi: { type: integer }
        mode: { type: string, enum: [tatap_muka, daring, hybrid] }
        metode_pembelajaran:
          type: object
          description: Bukti IKU 7
          properties:
            case_method: { type: boolean }
            team_based_project: { type: boolean }
            kolaboratif: { type: boolean }
        status_nilai: { type: string, enum: [belum, sebagian, final] }
        pengajar:
          type: array
          description: Bukti IKU 4 lewat `peran = praktisi`
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              nama: { type: string, description: Nama lengkap beserta gelar }
              nidn: { type: [string, "null"] }
              peran: { type: string, enum: [pengampu, pendamping, praktisi] }
              praktisi: { type: boolean }
              instansi: { type: [string, "null"], description: Instansi asal praktisi }
        jadwal:
          type: array
          items:
            type: object
            properties:
              hari: { type: string, example: Senin }
              jam_mulai: { type: string, example: "07:30" }
              jam_selesai: { type: string, example: "10:00" }
              ruang: { type: [string, "null"], description: Kode ruang }

    StudentActivity:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        semester: { type: string }
        mahasiswa:
          type: object
          properties:
            uuid: { type: string }
            nim: { type: string }
            nama: { type: string }
        jenis: { type: string, example: magang }
        jenis_label: { type: string }
        judul: { type: string }
        sks_konversi: { type: integer }
        terverifikasi: { type: boolean }

    AcademicTerm:
      type: object
      properties:
        kode: { type: string, example: "20261" }
        nama: { type: string, example: "2026/2027 Ganjil" }
        semester: { type: string, enum: [Ganjil, Genap, Antara] }
        aktif: { type: boolean }
        jendela:
          type: object
          properties:
            krs_dibuka: { type: boolean }
            penilaian_dibuka: { type: boolean }

    ProdiRingkas:
      type: object
      properties:
        kode: { type: string }
        nama: { type: string }
        jenjang: { type: string }

    CacahPerKode:
      description: Kode → cacah. Dikirim sebagai `[]` bila tidak ada satu pun catatan.
      oneOf:
        - type: object
          additionalProperties: { type: integer }
        - type: array
          maxItems: 0

    CacahPenugasan:
      type: object
      properties:
        total_penugasan: { type: integer }
        dosen_terlibat: { type: integer }
        per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
        per_jenis_mitra: { $ref: '#/components/schemas/CacahPerKode' }

    IkuData:
      type: object
      properties:
        semester: { type: string, example: "20261" }
        prodi: { type: string, description: 'Kode prodi yang diminta, atau `semua`' }
        catatan: { type: string }
        iku_1_lulusan:
          type: object
          properties:
            total_lulusan: { type: integer }
            pada_semester_ini: { type: integer }
            per_status_pekerjaan: { $ref: '#/components/schemas/CacahPerKode' }
            rata_ipk: { type: number, description: 0 bila belum ada lulusan }
        iku_2_pengalaman_luar_kampus:
          type: object
          properties:
            total_catatan: { type: integer }
            terverifikasi: { type: integer }
            belum_terverifikasi: { type: integer }
            mahasiswa_terlibat: { type: integer, description: Dari catatan terverifikasi }
            per_jenis: { $ref: '#/components/schemas/CacahPerKode' }
            per_sks_konversi:
              type: object
              description: Dikelompokkan, bukan diambangi — ambangnya milik konsumen.
              properties:
                "0-5": { type: integer }
                "6-19": { type: integer }
                "20+": { type: integer }
        iku_3_dosen_luar_kampus: { $ref: '#/components/schemas/CacahPenugasan' }
        iku_4_praktisi_mengajar:
          type: object
          properties:
            total_kelas: { type: integer }
            kelas_dengan_praktisi: { type: integer }
            praktisi_terlibat: { type: integer }
            penugasan_praktisi_mengajar: { $ref: '#/components/schemas/CacahPenugasan' }
        iku_7_kelas_kolaboratif:
          type: object
          properties:
            total_kelas: { type: integer }
            case_method: { type: integer }
            team_based_project: { type: integer }
            keduanya: { type: integer }
            salah_satu: { type: integer }
        iku_11_efisiensi:
          type: object
          properties:
            mahasiswa_aktif: { type: integer }
            dosen_aktif_ber_nidn: { type: integer }
            rasio_dosen_mahasiswa: { type: [number, "null"], description: Null bila tidak ada dosen ber-NIDN }
            per_status_mahasiswa: { $ref: '#/components/schemas/CacahPerKode' }
            jumlah_prodi: { type: integer }

  # ---------------------------------------------------------------------------
  # Webhook — sisi dorong dari kontrak ini
  # ---------------------------------------------------------------------------
  x-webhooks:
    description: |
      Konsumen mendaftarkan satu URL dan daftar event. Setiap kiriman
      ditandatangani HMAC-SHA256 atas `{timestamp}.{body}` memakai rahasia
      milik konsumen, dikirim pada header:

        X-OpenAcademic-Signature: <hex hmac>
        X-OpenAcademic-Timestamp: <unix timestamp>

      Timestamp ikut ditandatangani agar kiriman yang tertangkap tidak dapat
      diputar ulang dengan timestamp baru. Verifikasi wajib memakai perbandingan
      waktu-tetap (`hash_equals`), bukan `==`.

      Balasan 2xx dianggap berhasil. Selain itu dicoba ulang dengan jeda
      bertingkat 60s, 5m, 15m, 1j, 6j lalu menyerah dan menunggu pemutaran
      ulang manual dari konsol.
    events:
      - student.enrolled
      - student.status_changed
      - krs.approved
      - grade.finalized
      - student.graduated
      - activity.recorded
      - lecturer.assignment_recorded
    envelope:
      type: object
      properties:
        id: { type: string, format: uuid, description: Untuk mendeteksi kiriman ganda }
        event: { type: string }
        occurred_at: { type: string, format: date-time }
        institution: { type: string, description: Kode perguruan tinggi PDDIKTI }
        data: { type: object }
    # Muatan `data` per event. Hanya event yang muatannya dipaku tes yang
    # dicantumkan di sini; tes StudentEnrolledTest membandingkan kunci yang
    # benar-benar diterbitkan dengan daftar properti ini.
    payloads:
      student.enrolled:
        description: |
          Mahasiswa baru terbentuk — daftar ulang PMB (termasuk pindahan lewat
          PMB) atau intake pindahan/RPL langsung. Terbit satu kali per
          mahasiswa, sesudah transaksi pendaftarannya selesai. Adopsi dan klaim
          data PDDIKTI lama tidak menerbitkan event ini; mahasiswa yang sudah
          ada sebelumnya dibaca lewat `GET /students`.
        type: object
        required: [mahasiswa_uuid, nim, nama, prodi, angkatan, semester_masuk, status]
        properties:
          mahasiswa_uuid: { type: string, format: uuid }
          nim: { type: string }
          nama: { type: string }
          email: { type: [string, "null"] }
          prodi: { type: string, description: Kode program studi }
          angkatan: { type: integer }
          semester_masuk: { type: string, description: "Kode semester PDDIKTI, mis. 20261" }
          jenis_daftar: { type: [string, "null"], description: "baru | pindahan | rpl_transfer | rpl_perolehan | fast_track | non_gelar" }
          status: { type: string, description: "Kode status mahasiswa, mis. A" }
